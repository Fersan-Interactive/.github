# Checks that a pull request title is a Conventional Commit header (CONTRIBUTING.md §3 and §4). With squash merges the
# title becomes the commit subject on main. The organisation ruleset `main` requires it on the default branch of every
# repository, which needs the pull_request trigger; that trigger also runs it for this repository's own pull requests.
name: Pull request title

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions: {}

jobs:
  title:
    name: pull request title
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      pull-requests: read
    steps:
      - name: Check the title
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # The current title rather than the event's: a ruleset runs this workflow only when a pull request is opened,
          # reopened or pushed to, so after a title edit a re-run of this check must read the new title.
          TITLE=''
          if [ -n "$NUMBER" ]; then
            TITLE=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$NUMBER" --jq .title)
          fi
          types='build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test'
          header="^(${types})(\([a-z0-9]+([._/-][a-z0-9]+)*\))?!?: [^[:space:]](.*[^.[:space:]])?$"
          problem=''
          if [ -z "$TITLE" ]; then
            problem='this event carries no pull request title'
          elif [ "${#TITLE}" -gt 100 ]; then
            problem="the title has ${#TITLE} characters; the limit is 100"
          elif ! [[ $TITLE =~ $header ]]; then
            problem="expected <type>(<scope>)!: <subject>, with a type among ${types//|/, }, a lowercase scope and no final period"
          fi
          if [ -n "$problem" ]; then
            echo "::error title=Pull request title::${problem}. Title: ${TITLE}"
            echo "Examples: 'fix(contact): keep the copy button inside the card', 'ci: deploy each pull request to a preview channel'."
            echo "Guide: https://github.com/Fersan-Interactive/.github/blob/main/CONTRIBUTING.md#3-commits"
            exit 1
          fi
          echo "Conventional Commit header: ${TITLE}"
